name: Generate RSS Feeds

on:
  schedule:
    # 07:00 UTC = 08:00 CET (Berlin winter time). Note: GitHub Actions cron runs in UTC
    # and cannot follow DST — in summer (CEST, UTC+2) this will fire at 09:00 Berlin time.
    - cron: "0 7 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  models: read  # Required to call the GitHub Models inference API
  pages: write  # Required to deploy to GitHub Pages
  id-token: write # Required for OIDC-based Pages deployment

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate RSS feeds
        env:
          # GITHUB_TOKEN is automatically provided by Actions.
          # It is used to authenticate with the GitHub Models API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override the model by setting a GITHUB_MODEL repository variable.
          # Default: gpt-4o-mini (Low tier, 8k input tokens).
          # Other options: gpt-4o, gpt-4.1, Llama-3.3-70B-Instruct, Mistral-Large-2411
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL }}
        run: pnpm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
